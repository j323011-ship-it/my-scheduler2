<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#cba6f7">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="スケジュール">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>スケジュール管理</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container">

        <!-- 左側：タスクリスト（PC用） -->
        <div id="task-panel">
            <h2>📋 タスクリスト</h2>
            <div id="task-input-area">
                <input type="text" id="task-input" placeholder="タスクを入力...">
                <input type="date" id="task-date">
                <select id="task-status">
                    <option value="Next Up">Next Up</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Done">Done</option>
                </select>
                <select id="task-category">
                    <option value="仕事">仕事</option>
                    <option value="学習">学習</option>
                    <option value="プライベート">プライベート</option>
                </select>
                <button id="add-task">追加</button>
            </div>
            <div id="filter-area">
                <button class="filter-btn active" data-filter="all">すべて</button>
                <button class="filter-btn" data-filter="Next Up">Next Up</button>
                <button class="filter-btn" data-filter="In Progress">In Progress</button>
                <button class="filter-btn" data-filter="Done">Done</button>
            </div>
            <ul id="task-list"></ul>
        </div>

        <!-- 右側：カレンダー -->
        <div id="calendar-panel">
            <div id="calendar-header">
                <button id="prev-month">＜</button>
                <span id="calendar-title"></span>
                <button id="next-month">＞</button>
            </div>
            <div id="calendar"></div>
        </div>

    </div>

    <!-- スマホ用：タスクドロワー -->
    <div id="drawer-overlay" class="hidden"></div>
    <div id="task-drawer">
        <div id="drawer-handle"></div>
        <div id="drawer-inner">
            <h2>📋 タスクリスト</h2>
            <div id="drawer-input-area">
                <input type="text" id="drawer-task-input" placeholder="タスクを入力...">
                <input type="date" id="drawer-task-date">
                <select id="drawer-task-status">
                    <option value="Next Up">Next Up</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Done">Done</option>
                </select>
                <select id="drawer-task-category">
                    <option value="仕事">仕事</option>
                    <option value="学習">学習</option>
                    <option value="プライベート">プライベート</option>
                </select>
                <button id="drawer-add-task">追加</button>
            </div>
            <div id="drawer-filter-area">
                <button class="drawer-filter-btn active" data-filter="all">すべて</button>
                <button class="drawer-filter-btn" data-filter="Next Up">Next Up</button>
                <button class="drawer-filter-btn" data-filter="In Progress">In Progress</button>
                <button class="drawer-filter-btn" data-filter="Done">Done</button>
            </div>
            <ul id="drawer-task-list"></ul>
        </div>
    </div>

    <!-- スマホ用：タスクボタン -->
    <button id="task-fab">📋</button>

    <!-- 24時間表モーダル -->
    <div id="day-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-date-title"></h2>
                <button id="modal-close">✕</button>
            </div>
            <div class="modal-body">
                <div id="hourly-panel">
                    <h3>🕐 時間割</h3>
                    <div id="hourly-table"></div>
                </div>
                <div id="day-task-panel">
                    <h3>📋 この日のタスク</h3>
                    <ul id="day-task-list"></ul>
                    <div id="day-task-input-area">
                        <input type="text" id="day-task-input" placeholder="タスクを追加...">
                        <button id="day-add-task">追加</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
